<script id="vite-plugin-pwa:inline-sw">if('serviceWorker' in navigator) {window.addEventListener('load', () => {navigator.serviceWorker.register('./sw.js', { scope: './' })})}</script></head>
<body>
  <canvas id="view" aria-label="Kindling, a pocket monster morning in Hearth"></canvas>
  <section id="title">
    <p class="eyebrow">A first morning</p>
    <h1>Kindling</h1>
    <p class="lede">Hearth is one town. Three creatures woke at dawn. One of them leaves with you.</p>
    <label>Your name <input id="name" maxlength="10" autocomplete="nickname" value="Ren" /></label>
    <div class="row">
      <button id="wake" type="button">Wake up</button>
      <button id="continue" type="button" hidden>Continue</button>
    </div>
    <p class="fine">Open this page once, then it runs offline.</p>
  </section>
  <div id="hud" hidden>
    <div class="where">
      <p id="place">Hearth</p>
      <p id="goal">Talk to Mom</p>
    </div>
    <div id="partner" hidden>
      <p id="partner-name">Pip Lv 5</p>
      <div class="track mini"><div id="partner-hp"></div></div>
    </div>
  </div>
  <div id="tools">
    <button id="pause" type="button" aria-label="Pause" aria-pressed="false">Pause</button>
    <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">Sound</button>
  </div>
  <div id="box" hidden>
    <p id="who"></p>
    <p id="line"></p>
    <div id="choice" hidden>
      <button id="choice-yes" type="button">Yes</button>
      <button id="choice-no" type="button">No</button>
    </div>
  </div>
  <div id="battle" hidden>
    <div id="foe-card" class="card">
      <div class="card-top"><span id="foe-name"></span><span id="foe-lv"></span></div>
      <div class="track"><div id="foe-hp"></div></div>
    </div>
    <div id="my-card" class="card">
      <div class="card-top"><span id="my-name"></span><span id="my-lv"></span></div>
      <div class="track"><div id="my-hp"></div></div>
    </div>
    <div id="battle-box">
      <p id="battle-text"></p>
      <div id="battle-actions"></div>
    </div>
  </div>
  <div id="paused" hidden><p>Paused</p></div>
  <div id="touch">
    <div id="stick" aria-hidden="true"><div id="knob"></div></div>
    <button id="act" type="button" aria-label="Talk">A</button>
  </div>
  <p id="status" class="sr-only" aria-live="polite">Kindling. A first morning in Hearth.</p>
</body>
</html>
